name: Confirm Vercel release

# Vercel builds and deploys every push itself; its build command (vercel.json) runs the same suites as the Pages
# workflow, so a failing check stops the release. When Vercel reports a successful production deployment, this
# workflow waits for the public site to serve the pushed commit and checks that analytics can load. Vercel sends no
# GitHub event for this project, so it polls; if Vercel's checks fail, the site never updates and this run fails.
# A newer push cancels the older wait. Run it by hand to check the current main.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-confirm
  cancel-in-progress: true

permissions:
  contents: read

env:
  SITE_URL: https://8bit-drift.vercel.app

jobs:
  confirm:
    name: Confirm the live Vercel site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      # Vercel's build runs the suites (about 2-3 minutes) before the domain switches, so retry for up to ten minutes.
      - name: Live page is byte-identical to this commit's dist/index.html
        run: |
          sha=$(git rev-parse HEAD)
          want=$(sha256sum dist/index.html | cut -d' ' -f1)
          for attempt in $(seq 1 60); do
            got=$(curl -fsSL -H 'Cache-Control: no-cache' "${SITE_URL}/?v=${sha}" | sha256sum | cut -d' ' -f1) || got=none
            if [ "$got" = "$want" ]; then
              {
                echo "### Published on Vercel"
                echo "${SITE_URL} now serves commit \`${sha::7}\` (index.html sha256 \`${want::12}\`)."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "Live site matches ${sha::7} (attempt ${attempt})."
              exit 0
            fi
            sleep 10
          done
          echo "::error::${SITE_URL} does not serve commit ${sha::7} after 10 minutes (live sha256 ${got::12}, expected ${want::12})."
          exit 1
      - name: Vercel Web Analytics script is served
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "${SITE_URL}/_vercel/insights/script.js")
          if [ "$code" = "200" ]; then
            echo "Analytics script is served."
          else
            echo "::warning::${SITE_URL}/_vercel/insights/script.js returned HTTP ${code}. Enable Web Analytics in the Vercel project's Analytics tab."
          fi
